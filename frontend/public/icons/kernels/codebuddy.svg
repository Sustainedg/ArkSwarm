<?xml version="1.0" encoding="UTF-8"?>
<!-- 腾讯 CodeBuddy：官方标识是彩色渐变图形，没有可直接取用的单色 glyph，
     这里画一个「代码伙伴」机器人头像作为等价形状。
     前端把它当「遮罩」用（.kernel-logo 的 mask-image），因此这里只画形状、不指定颜色：
     染色由 CSS 的 background-color 决定，深浅两套外观自动跟着文字色走。
     眼睛与嘴用 evenodd 挖空（遮罩下呈透明），天线与头身保持实心。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="CodeBuddy CLI">
  <g fill="#000">
    <!-- 天线 -->
    <circle cx="12" cy="2.4" r="1.2"/>
    <rect x="11.3" y="3.2" width="1.4" height="2.4" rx="0.7"/>
    <!-- 头身 + 挖空的眼睛 -->
    <path fill-rule="evenodd" d="M6.2 5.4h11.6A4.2 4.2 0 0 1 22 9.6v7.4a4.2 4.2 0 0 1-4.2 4.2H6.2A4.2 4.2 0 0 1 2 17V9.6a4.2 4.2 0 0 1 4.2-4.2Zm2.6 6a1.7 1.7 0 1 0 0 3.4 1.7 1.7 0 0 0 0-3.4Zm6.4 0a1.7 1.7 0 1 0 0 3.4 1.7 1.7 0 0 0 0-3.4Z"/>
    <!-- 嘴 -->
    <rect x="9" y="16.6" width="6" height="1.5" rx="0.75"/>
  </g>
</svg>
