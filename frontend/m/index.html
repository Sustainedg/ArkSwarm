<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 移动端是「固定外壳」的应用形态（顶栏 + 底部 Tab + 内部滚动），不随手指缩放：
         maximum-scale / user-scalable 管住 Android 系；iOS 会忽略它们，另有 touch-action 兜底（见 mobile.css）。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Magenta Agents · 移动端</title>
    <meta name="description" content="Magenta Agents 移动端：在手机上查看智能体、角色与对话。" />
    <meta name="theme-color" content="#0b0a12" />
    <link rel="manifest" href="/m/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Magenta" />
    <meta name="format-detection" content="telephone=no" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/mobile/main.tsx"></script>
  </body>
</html>
