<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Magenta Agents · 多智能体控制台</title>
    <meta name="description" content="管理 Claude Code、Codex、Gemini CLI 等智能体，并为它们创建 AI 角色。" />
    <meta name="theme-color" content="#0b0a12" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- 首屏防闪：样式生效前先把主题定下来（与 src/lib/theme.ts 同一套规则，保持极简、无依赖）。
         放在 head 末尾：它要读的 meta（theme-color、状态栏样式）都在前面，又早于任何样式与脚本。 -->
    <script>
      ;(function () {
        try {
          var mode = localStorage.getItem('magenta.theme')
          var light =
            mode === 'light' ||
            (mode === 'auto' && window.matchMedia('(prefers-color-scheme: light)').matches)
          document.documentElement.dataset.theme = light ? 'light' : 'dark'
          if (!light) return
          var themeColor = document.querySelector('meta[name="theme-color"]')
          if (themeColor) themeColor.setAttribute('content', '#f4f3fa')
          // 浅色外壳下状态栏也要切成系统默认样式，否则 iOS 独立应用里是一排看不见的白字。
          var statusBar = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]')
          if (statusBar) statusBar.setAttribute('content', 'default')
        } catch (error) {
          /* 读不到设置就按默认深色渲染 */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
