# ArkSwarm Docker 部署
#
# 用法：
#   docker compose up -d            # 起后台
#   docker compose logs -f          # 看日志
#   docker compose down             # 停
#
# 首次启动 entrypoint 会从 GitHub 下载最新 Release 装进 arkswarm-app 卷
# （sha256 校验 + 安全解压；离线 / 没有 Release 时用镜像自带代码兜底）；
# 之后界面「设置 → 关于 → 检测更新」即可一键更新，无需重建镜像。
# 镜像自带 Claude Code / Codex / Gemini CLI / Hermes 内核。
#
# 自定义端口 / 代理 / 私有 fork：
#   ports / environment 按需改；完整变量见 backend/.env.example
services:
  arkswarm:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: arkswarm:latest
    container_name: arkswarm
    ports:
      - "8010:8010"
    volumes:
      - arkswarm-app:/app          # 版本目录 + venv（更新不丢）
      - arkswarm-data:/app/data    # SQLite / 工作区 / 密钥（独立卷，重建镜像不丢）
    environment:
      # 监听
      ARKSWARM_HOST: "0.0.0.0"
      ARKSWARM_PORT: "8010"
      # 更新源（私有 fork 改这里）
      ARKSWARM_UPDATE_REPO: "Sustainedg/ArkSwarm"
      # 代理（容器内访问 GitHub / npm registry 常需要）
      # HTTP_PROXY: "http://host.docker.internal:7890"
      # HTTPS_PROXY: "http://host.docker.internal:7890"
      # 内核凭据（不填则在界面里填）
      # ANTHROPIC_AUTH_TOKEN: "..."
      # OPENAI_API_KEY: "..."
      # GEMINI_API_KEY: "..."
    restart: unless-stopped

volumes:
  arkswarm-app:
  arkswarm-data: