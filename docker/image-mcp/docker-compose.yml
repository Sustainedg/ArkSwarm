# 独立图片 MCP 容器（仓库内模板；宿主机运行配置见 /vol1/1000/docker/image-mcp/docker-compose.yml）。
#
# 代码与镜像定义在 Coda 仓库里：
#   /vol1/1000/同步库/python/项目/Bot/docker/image-mcp/
# 这里只保留运行配置与数据：
#   /vol1/1000/docker/image-mcp/
#   ├── docker-compose.yml
#   ├── .env                # 网关密钥、MCP 令牌，权限 600
#   └── data/generated-images/
#
# 本模板用相对路径，可在仓库内直接 `docker compose up -d --build` 试跑；
# 正式部署用宿主机那份绝对路径版本。
services:
  image-mcp:
    build:
      context: ../..
      dockerfile: docker/image-mcp/Dockerfile
    image: coda-image-mcp:latest
    container_name: coda-image-mcp
    restart: unless-stopped
    ports:
      - "3070:8000"
    env_file:
      - .env
    environment:
      IMAGE_MCP_HOST: "0.0.0.0"
      IMAGE_MCP_PORT: "8000"
      IMAGE_MCP_DATA_DIR: "/data"
      # 同时接受容器网络名与宿主机地址：Magpie 走前者，Coda / 浏览器走后者。
      # 宿主机地址在部署侧 override 里按实际填写，仓库模板只放占位符。
      IMAGE_MCP_ALLOWED_HOSTS: "${IMAGE_MCP_ALLOWED_HOSTS:-image-mcp,image-mcp:8000,127.0.0.1,127.0.0.1:3070,127.0.0.1:8000,localhost,localhost:3070,localhost:8000}"
      # 生图脚本返回的图片 URL：由本容器自己的 /images/ 提供。
      IMAGE_PUBLIC_BASE_URL: "${IMAGE_PUBLIC_BASE_URL:-http://<host>:3070/images}"
      # 图生图参考图：Coda 的工作区以只读方式挂进来。
      IMAGE_GEN_INPUT_ROOTS: "/workspaces"
      IMAGE_RETENTION_MINUTES: "60"
      TZ: "Asia/Shanghai"
    volumes:
      - ./data:/data
      - /vol1/1000/docker/coda/data/workspaces:/workspaces:ro
    networks:
      - magpie
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  magpie:
    external: true
    name: magpie_default
